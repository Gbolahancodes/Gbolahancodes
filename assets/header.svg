<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1B26"/>
      <stop offset="100%" stop-color="#16161E"/>
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F7768E"/>
      <stop offset="50%" stop-color="#BB9AF7"/>
      <stop offset="100%" stop-color="#7DCFFF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="300" rx="15" fill="url(#bg-gradient)"/>
  <rect x="2" y="2" width="1196" height="296" rx="13" fill="none" stroke="#292E42" stroke-width="2"/>

  <!-- macOS Window Controls -->
  <circle cx="40" cy="35" r="7" fill="#F7768E"/>
  <circle cx="65" cy="35" r="7" fill="#E0AF68"/>
  <circle cx="90" cy="35" r="7" fill="#9ECE6A"/>

  <text x="600" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#565F89">Gbolahancodes — portfolio.tsx</text>

  <line x1="0" y1="65" x2="1200" y2="65" stroke="#292E42" stroke-width="2"/>

  <!-- Code Editor Content -->
  <text x="50" y="120" font-family="'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="18" fill="#BB9AF7">const <tspan fill="#7DCFFF">developer</tspan> <tspan fill="#89DDFF">=</tspan> <tspan fill="#F7768E">{</tspan></text>
  
  <text x="90" y="165" font-family="'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="20" fill="#9ECE6A">name<tspan fill="#89DDFF">:</tspan> <tspan fill="#E0AF68">'Gbolahan Bantefa'</tspan><tspan fill="#89DDFF">,</tspan></text>
  
  <text x="90" y="210" font-family="'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="20" fill="#9ECE6A">roles<tspan fill="#89DDFF">:</tspan> <tspan fill="#F7768E">[</tspan><tspan fill="#E0AF68">'Software Engineer'</tspan><tspan fill="#89DDFF">, </tspan><tspan fill="#E0AF68">'ML Engineer'</tspan><tspan fill="#F7768E">]</tspan><tspan fill="#89DDFF">,</tspan></text>
  
  <text x="50" y="255" font-family="'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="18" fill="#F7768E">}<tspan fill="#89DDFF">;</tspan></text>

  <!-- Glowing Accent -->
  <circle cx="1050" cy="160" r="60" fill="#BB9AF7" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1100" cy="200" r="40" fill="#F7768E" opacity="0.15" filter="url(#glow)"/>
</svg>
