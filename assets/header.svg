<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027">
        <animate attributeName="stop-color" values="#0f2027;#2c5364;#0f2027" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#2c5364">
        <animate attributeName="stop-color" values="#2c5364;#00c6ff;#2c5364" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00c6ff">
        <animate attributeName="stop-color" values="#00c6ff;#0f2027;#00c6ff" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <style>
      .name { font: 700 44px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .sub { font: 500 20px 'Courier New', monospace; fill: #d7f4ff; }
      .cursor { fill: #ffffff; }
    </style>
  </defs>

  <rect width="900" height="220" fill="url(#bg)" rx="12"/>

  <text x="60" y="95" class="name">Hi, I'm Gbolahan</text>

  <text x="62" y="140" class="sub">
    <tspan>
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.2s" fill="freeze"/>
      Software Engineering Student
    </tspan>
  </text>

  <g>
    <text x="62" y="175" class="sub" opacity="0">
      Documenting the journey on TikTok
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.35;0.9;1" dur="9s" begin="1.5s" repeatCount="indefinite"/>
    </text>
    <text x="62" y="175" class="sub" opacity="0">
      Building in public, one commit at a time
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.5;0.9;1" dur="9s" begin="4.5s" repeatCount="indefinite"/>
    </text>
  </g>

  <rect x="62" y="150" width="12" height="20" class="cursor">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
